/* Liquid glass + paleta premium (esmeralda profundo, champán y tinta). Para volver atrás basta con quitar este bloque. */
:root{

<script>
(function(){
"use strict";
/* =====================================================================
   CONFIGURACIÓN — pega aquí el «ID de cliente» OAuth (tipo «Aplicación
   web») de tu proyecto de Google Cloud. Es público por diseño, no es una
   contraseña. Si lo dejas vacío, la app funciona en MODO DEMO local.
   ===================================================================== */
var CONFIG={GOOGLE_CLIENT_ID:''};

var DEMO=!CONFIG.GOOGLE_CLIENT_ID;
var TYPES={Swimming:'Natación',Running:'Carrera',Cycling:'Bici',TraditionalStrengthTraining:'Fuerza',FunctionalStrengthTraining:'Fuerza funcional',Walking:'Caminata',Soccer:'Fútbol',Hiking:'Senderismo',Rowing:'Remo',Elliptical:'Elíptica',HIIT:'HIIT',Yoga:'Yoga',Other:'Otro'};
var KINDS=[['gym','Fuerza'],['cardio','Cardio'],['rest','Descanso']];
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], DOW=['dom','lun','mar','mié','jue','vie','sáb'];
var DOWFULL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var pad=function(n){return String(n).padStart(2,'0')};
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function fmtDate(s){var d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()]}
function fmtShort(s){var d=parse(s);return d.getDate()+' '+MES[d.getMonth()]}
function weekStart(s){var d=parse(s);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:null}
function fmt(n,d){return n==null?'–':Number(n).toLocaleString('es-ES',{maximumFractionDigits:d==null?1:d})}
function nowTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function nowIso(){return new Date().toISOString()}
function stGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function stSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function stDel(k){try{localStorage.removeItem(k)}catch(e){}}

var COLS=['plan','days','lifts','meals','body','watch','vitals','sleep','steps','settings'];
var S={tab:'train',back:'train',date:today(),auth:'wait',user:null,plan:{},lifts:{},meals:{},body:{},watch:{},sleep:{},vitals:{},steps:{},days:{},settings:{},ready:{},armed:null,
  watchLimit:15,wk:'workout',newDay:{label:'',name:'',kind:'gym'},
  draft:{meal:{name:'',kcal:'',p:'',est:true,time:''},body:{weight:'',waist:'',neck:'',hip:''},newEx:'',w:{},plNew:{},gymNew:''}};

/* ---------- ajustes de cada persona (nada viene fijado) ---------- */
function ME(){return S.settings.me||{}}
function zonesOf(m){m=m||ME();if(!(m.hrMax>0&&m.hrRest>0&&m.hrMax>m.hrRest))return null;
  /* Zonas por reserva cardíaca (método de Karvonen): 50/60/70/80/90 % de la reserva. Es una estimación. */
  return [.5,.6,.7,.8,.9].map(function(f){return Math.round(m.hrRest+f*(m.hrMax-m.hrRest))})}
function T(){var m=ME();return {train:{kcal:m.trainKcal||null,p:m.trainP||null},rest:{kcal:m.restKcal||null,p:m.restP||null},
  height:m.height||null,z2Goal:m.z2Goal||null,zones:zonesOf(m)}}
function planDays(){return Object.keys(S.plan).map(function(k){return Object.assign({id:k},S.plan[k])}).sort(function(a,b){return (a.order||0)-(b.order||0)})}
function defaultDay(s){var sc=ME().schedule||[];var d=sc[parse(s).getDay()];return d&&S.plan[d]?d:null}
function dayOf(date){var d=S.days[date]&&S.days[date].day;return (d&&S.plan[d])?d:defaultDay(date)}
function isTrain(date){var p=S.plan[dayOf(date)];return !!(p&&p.kind==='gym')}

/* ---------- almacenamiento: copia local + Google Drive ---------- */
/* Todos los datos de la persona forman un documento JSON. Vive en este navegador
   y, con Google, en SU Drive, dentro de la carpeta privada de la app (appDataFolder). */
function blankData(){var d={v:2,cols:{},deleted:{}};COLS.forEach(function(c){d.cols[c]={}});return d}
function normalize(d){var b=blankData();if(!d||typeof d!=='object'||!d.cols)return b;COLS.forEach(function(c){b.cols[c]=Object.assign({},d.cols[c]||{})});b.deleted=Object.assign({},d.deleted||{});return b}
/* Fusión entre dispositivos: por documento gana la versión más reciente; los borrados se recuerdan 180 días. */
function mergeData(a,b){a=normalize(a);b=normalize(b);var o=blankData(),cut=new Date(Date.now()-180*864e5).toISOString();
  [a.deleted,b.deleted].forEach(function(src){Object.keys(src).forEach(function(k){var t=src[k];if(t>=cut&&(!o.deleted[k]||t>o.deleted[k]))o.deleted[k]=t})});
  COLS.forEach(function(c){[a.cols[c],b.cols[c]].forEach(function(m){Object.keys(m).forEach(function(id){var r=m[id],ex=o.cols[c][id];if(!ex||(r._u||'')>(ex._u||''))o.cols[c][id]=r})});
    Object.keys(o.cols[c]).forEach(function(id){var t=o.deleted[c+'/'+id];if(t&&t>=(o.cols[c][id]._u||''))delete o.cols[c][id]})});
  return o}
var ST={key:null,mem:null};
function bindCols(){COLS.forEach(function(c){S[c]=ST.mem.cols[c];S.ready[c]=true})}
function openStore(key){ST.key=key;ST.mem=normalize(stGet(key,null));bindCols()}
function persist(){stSet(ST.key,ST.mem);if(!DEMO)scheduleSync()}

/* ---------- escritura ---------- */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2600)}
function canWrite(){if(!ST.mem){toast('Entra con tu cuenta para guardar');return false}return true}
function saveDoc(col,id,obj){if(!canWrite())return;obj._u=nowIso();ST.mem.cols[col][id]=obj;delete ST.mem.deleted[col+'/'+id];persist()}
function removeDoc(col,id){if(!canWrite())return;delete ST.mem.cols[col][id];ST.mem.deleted[col+'/'+id]=nowIso();persist()}
function saveMe(patch){var m=Object.assign({},ME(),patch);S.settings.me=m;saveDoc('settings','me',m);schedule()}

/* ---------- datos derivados ---------- */
function liftsByEx(){var m={};Object.keys(S.lifts).forEach(function(k){var l=S.lifts[k];if(!l||!l.exId)return;(m[l.exId]=m[l.exId]||[]).push(l)});
  Object.keys(m).forEach(function(k){m[k].sort(function(a,b){return a.date<b.date?1:-1})});return m}
var TIMED={'plank':1,'hollow':1,'side-plank':1};/* ejercicios por tiempo: se anotan solo segundos (se guardan en reps) */
function isTimed(ex){if(!ex)return false;if(ex.timed!=null)return !!ex.timed;if(TIMED[ex.id])return true;
  var pe=null;planDays().some(function(d){return (d.exercises||[]).some(function(e){if(e.id===ex.id){pe=e;return true}})});return !!(pe&&pe.timed)}
function setsText(sets,timed){return (sets||[]).filter(function(s){return s.kg!=null||s.reps!=null}).map(function(s){return timed?(s.reps==null?'–':s.reps+' s'):fmt(s.kg)+'×'+(s.reps==null?'–':s.reps)}).join(' · ')}
function e1rm(s){return (s.kg||0)*(1+(s.reps||0)/30)}
function bestSet(list){var b=null;list.forEach(function(l){(l.sets||[]).forEach(function(s){if(s.kg&&s.reps&&(!b||e1rm(s)>e1rm(b.s)))b={s:s,date:l.date}})});return b}

/* ---------- gráficos ---------- */
function lineChart(series,opt){
  var W=320,H=opt.h||150,L=34,R=8,Tp=8,B=20,all=[];
  series.forEach(function(s){s.pts.forEach(function(p){all.push(p)})});
  if(!all.length)return '';
  var xs=all.map(function(p){return parse(p.x).getTime()}),ys=all.map(function(p){return p.y});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  var padY=(y1-y0)*.15||1;y0-=padY;y1+=padY;if(x1===x0){x0-=864e5*3;x1+=864e5*3}
  var sx=function(t){return L+(t-x0)/(x1-x0)*(W-L-R)},sy=function(v){return Tp+(1-(v-y0)/(y1-y0))*(H-Tp-B)};
  var out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label)+'">';
  for(var i=0;i<=3;i++){var v=y0+(y1-y0)*i/3,y=sy(v);out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+fmt(v,opt.dec==null?1:opt.dec)+'</text>'}
  var first=new Date(x0),last=new Date(x1);
  out+='<text x="'+L+'" y="'+(H-4)+'">'+fmtShort(iso(first))+'</text><text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">'+fmtShort(iso(last))+'</text>';
  series.forEach(function(s){
    var pts=s.pts.map(function(p){return [sx(parse(p.x).getTime()),sy(p.y)]});
    if(s.line&&pts.length>1)out+='<polyline fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2)+'" stroke-linejoin="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';
    if(s.dots)pts.forEach(function(p){out+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(s.r||2.5)+'" fill="'+s.color+'"/>'});
    if(s.endLabel&&pts.length){var q=pts[pts.length-1];out+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4" fill="'+s.color+'"/>'}
  });
  return out+'</svg>';
}
function zoneBar(z,total){if(!z)return '';var t=total||z.reduce(function(a,b){return a+b},0)||1;
  return '<div class="zbar">'+z.map(function(m,i){return m>0?'<i style="width:'+(m/t*100).toFixed(1)+'%;background:var(--z'+i+')"></i>':''}).join('')+'</div>'}
function zoneLabels(){var z=T().zones;if(!z)return ['Z0','Z1','Z2 · Zone 2','Z3','Z4','Z5'];return ['<'+z[0],z[0]+'–'+(z[1]-1),z[1]+'–'+(z[2]-1)+' Zone 2',z[2]+'–'+(z[3]-1),z[3]+'–'+(z[4]-1),z[4]+'+']}
function zoneLegend(){var lab=zoneLabels();
  return '<div class="legend">'+lab.map(function(l,i){return '<span style="--c:var(--z'+i+')">'+l+'</span>'}).join('')+'</div>'}
function zoneNote(){var m=ME(),z=T().zones;return z?'Zonas por reserva cardíaca (método de Karvonen) con tu FC máx. '+m.hrMax+' y en reposo '+m.hrRest+' lpm. Es una estimación.':'Para ver tus rangos en lpm, pon tu FC máxima y en reposo en Ajustes.'}

/* ---------- vistas ---------- */
var GEAR='<button class="ib" data-act="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>';
function header(){
  if(S.tab==='progress')return '<div class="top"><div class="date"><span class="ib" style="visibility:hidden"></span><h1 style="text-transform:none">Progreso general</h1>'+GEAR+'</div></div>';
  if(S.tab==='settings'||S.tab==='plan')return '<div class="top"><div class="date"><button class="ib" data-act="back" aria-label="Volver">‹</button><h1 style="text-transform:none">'+(S.tab==='plan'?'Plan de entreno':'Ajustes')+'</h1><span class="ib" style="visibility:hidden"></span></div></div>';
  var d=S.date,day=dayOf(d),pd=planDays();
  var h='<div class="top"><div class="date"><button class="ib" data-act="prev" aria-label="Día anterior">‹</button><h1>'+fmtDate(d)+'</h1><button class="ib" data-act="next" aria-label="Día siguiente">›</button>'+GEAR+'</div>';
  if(d!==today())h+='<div style="text-align:center"><button class="today" data-act="today">Ir a hoy</button></div>';
  if((S.tab==='train'||S.tab==='food')&&pd.length){
    h+='<div class="chips" role="group" aria-label="Tipo de día">'+pd.map(function(p){return '<button class="chip" data-act="day" data-day="'+esc(p.id)+'" aria-pressed="'+(p.id===day)+'">'+esc(p.label||'·')+'<small>'+esc(p.name||'')+'</small></button>'}).join('')+'</div>'}
  return h+'</div>';
}
function viewTrainMain(){
  var day=dayOf(S.date),plan=S.plan[day],out='',dd0=S.days[S.date],hasOv=!!(dd0&&dd0.exercises&&dd0.exercises.length),by=liftsByEx();
  if(!planDays().length){
    out+='<div class="card"><h2>Crea tu plan</h2><p class="muted" style="margin:6px 0 10px">Define tus días (por ejemplo «A · Pecho», «B · Espalda», «Descanso»), sus ejercicios y qué día de la semana toca cada uno. Mientras tanto puedes anotar ejercicios sueltos abajo.</p><button class="btn block" data-act="openPlan">Crear mi plan</button></div>';
    out+=watchOfDay();out+=extraLifts({},by);out+=addExCard();return out;
  }
  if((!plan||plan.kind!=='gym')&&!hasOv){
    var z=T().zones;
    out+='<div class="card"><h2>'+(plan&&plan.kind==='cardio'?esc(plan.name||'Cardio'):'Día de descanso')+'</h2><p class="muted" style="margin:6px 0 0">'+
      (plan&&plan.kind==='cardio'?(plan.note?esc(plan.note)+' ':'')+(z?'Zone 2 con tus ajustes: entre '+z[1]+' y '+(z[2]-1)+' lpm (estimación).':'Pon tu FC máxima y en reposo en Ajustes para ver tu rango de Zone 2.'):(plan&&plan.note?esc(plan.note):'Sin pesas.'))+'</p></div>';
    out+=watchOfDay();
    out+=swimCard(plan);
    out+=extraLifts({},by);
    out+=addExCard();
    return out;
  }
  var exs=(dd0&&dd0.exercises&&dd0.exercises.length?dd0.exercises:plan.exercises)||[],inPlan={},sets=0,ton=0;
  Object.keys(S.lifts).forEach(function(k){var l=S.lifts[k];if(l.date===S.date)(l.sets||[]).forEach(function(s){if(s.kg!=null&&s.reps!=null){sets++;ton+=s.kg*s.reps}})});
  out+='<div class="card row" style="justify-content:space-between"><div><div class="up">Día '+esc(plan.label||'')+' · '+esc(plan.name||'')+'</div><div class="small muted">Volumen de hoy</div></div><div class="num" style="font-size:22px;font-weight:600;text-align:right">'+sets+' series · '+fmt(ton,0)+' kg</div></div>';
  out+=watchOfDay();
  if(!exs.length)out+='<div class="card empty">Este día aún no tiene ejercicios. <button class="link" data-act="openPlan">Añádelos en el plan</button></div>';
  exs.forEach(function(ex){inPlan[ex.id]=1;out+=exCard(ex,by)});
  out+=extraLifts(inPlan,by);
  out+=addExCard();
  out+=swimCard(plan);
  return out;
}
function extraLifts(inPlan,by){var out='';Object.keys(S.lifts).map(function(k){return S.lifts[k]}).filter(function(l){return l.date===S.date&&!inPlan[l.exId]}).forEach(function(l){out+=exCard({id:l.exId,name:l.name,extra:1,timed:l.timed},by)});return out}
function addExCard(){return '<div class="card"><label for="newex">Añadir ejercicio de hoy</label><div class="row"><input type="text" id="newex" data-f="newEx" list="catalog" placeholder="Nombre del ejercicio" value="'+esc(S.draft.newEx)+'"><button class="btn" data-act="addEx">Añadir</button></div>'+
  '<div class="row" style="justify-content:space-between;margin-top:4px"><button class="link" data-act="openPlan">Editar plan</button>'+restSourcesLink()+'</div></div>'}
function swimCard(plan){
  var sw=plan&&(plan.extra&&plan.extra.name?plan.extra:(plan.kind==='cardio'?{name:plan.name,target:plan.target||'',note:''}:null));if(!sw)return '';
  var ws=Object.keys(S.watch).map(function(k){return S.watch[k]}).filter(function(w){return w.date===S.date&&String(w.type).indexOf('Strength')<0});
  var done=!!(S.days[S.date]&&S.days[S.date].swim);
  var h='<div class="card"><div class="meta"><h3>'+esc(sw.name)+'</h3>'+(sw.target?'<span class="target">'+esc(sw.target)+'</span>':'')+'</div><div class="small muted" style="margin:4px 0 8px">'+esc(sw.note||'')+'</div>';
  if(ws.length)h+=ws.map(function(w){return '<div class="small"><b>Reloj:</b> '+esc(TYPES[w.type]||w.type)+' · '+fmt(w.min,0)+' min'+(w.avgHr?' · media '+w.avgHr+' lpm':'')+(w.z?' · Zone 2: '+fmt(w.z[2],0)+' min':'')+'</div>'}).join('');
  h+='<button class="btn'+(done?'':' ghost')+' block" style="margin-top:8px" data-act="swimDone" aria-pressed="'+done+'">'+(done?esc(sw.name)+' hecho':'Marcar '+esc(sw.name)+' como hecho')+'</button>';
  return h+'</div>';
}
/* Vídeos de técnica: enlaces a la biblioteca de smartworkout.app (página en alemán). Se abren en otra pestaña. */

  'mb-slam':[['Slam','schultern/medizinball-schlag'],['Kettlebell swing','beine/kettlebell-schwingen']],
  'bench':[['Barra','brust/bankdrucken-langhantel-flachbank'],['Mancuernas','brust/kurzhantel-bankdrucken']],

  'cable-fly':[['Técnica','brust/kabelzug-fliegende']],

  'face-pull':[['Técnica','schultern/kabel-gesichtszug']],
  'triceps-push':[['Técnica','trizeps/kabelzug-trizepsdrucken']],
  'tri-overhead':[['En polea','trizeps/hochzug-uberkopf-trizepsstreckung'],['Con mancuerna','trizeps/einarmige-uberkopf-trizepsstreckung']],
  'hammer-curl':[['Técnica','bizeps/hammercurl']],
  'hollow':[['Técnica','bauchmuskeln/hohlkorperhaltung']],
  'hip-abd':[['En polea','glutes/kabel-huftabduktion'],['Sentado','glutes/sitzende-huftabduktion']],
  'leg-curl':[['Técnica','beine/sitzende-beinbeugemaschine']],
  'cable-rotation':[['Horizontal','bauchmuskeln/kabelrotation-(horizontal)'],['Alto a bajo','bauchmuskeln/kabelrotation-(oben-unten)']],
  'side-plank':[['Técnica','bauchmuskeln/seitliche-planke']],
  'rev-crunch':[['Técnica','bauchmuskeln/umgekehrte-crunches']],
  'cable-kickback':[['Técnica','glutes/kabel-kickback-fur-die-gesa%C3%9Fmuskulatur']],

/* % de grasa por el método de la Marina de EE. UU. (Hodgdon y Beckett), versión en centímetros. Es una estimación. */
function navyBf(sex,waist,neck,hip,height){
  if(!height||!waist||!neck)return null;
  if(sex==='h'){if(waist<=neck)return null;return 495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(height))-450}
  if(sex==='m'){if(!hip||waist+hip<=neck)return null;return 495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(height))-450}
  return null}

function viewWatch(){return watchEntry()+sleepCard()+viewWatchMain()}
function viewWatchMain(){
  var ws=Object.keys(S.watch).map(function(k){return Object.assign({id:k},S.watch[k])}).sort(function(a,b){return (a.date+(a.start||''))<(b.date+(b.start||''))?1:-1});

  var wk=weekStart(today()),thisWeek=0;cardio.forEach(function(w){if(w.date>=wk)thisWeek+=w.z[2]||0});
  var vo=vit.filter(function(v){return v.vo2max!=null}),vlast=vo[vo.length-1],vfirst=vo[0];
  var cut=addDays(today(),-14),rh=vit.filter(function(v){return v.rhr!=null&&v.date>=cut}),rhr=rh.length?rh.reduce(function(a,v){return a+v.rhr},0)/rh.length:null;

    '<div class="tile"><div class="up">Pulso en reposo</div><div class="v">'+(rhr?fmt(rhr,0):'–')+' <small>lpm</small></div><div class="small muted">media 14 días ('+rh.length+' lecturas)</div></div>'+
    '<div class="tile" style="grid-column:1/-1"><div class="up">Zone 2 esta semana (cardio)</div><div class="v">'+fmt(thisWeek,0)+' <small>'+(g?'/ '+g+' min':'min')+'</small></div>'+(g?'<div class="bar"><i style="width:'+Math.min(100,thisWeek/g*100).toFixed(0)+'%"></i></div>':'')+'<div class="small muted">'+(ws.length?'Datos hasta el '+fmtShort(ws[0].date)+'. ':'')+(g?'Objetivo semanal ajustable.':'Define tu objetivo semanal en Ajustes.')+' Solo cuentan los entrenos con minutos por zona.</div></div></div>';
  // semanas
  var weeks=[],w0=weekStart(today());for(var i=7;i>=0;i--)weeks.push(addDays(w0,-7*i));

  var tot=weeks.map(function(wd){var z=[0,0,0,0,0,0];cardio.forEach(function(w){if(weekStart(w.date)===wd)for(var k=0;k<6;k++)z[k]+=w.z[k]||0});return z}),mx=Math.max.apply(null,tot.map(function(z){return z.reduce(function(a,b){return a+b},0)}).concat([g||1]));
  var W=320,H=150,L=30,B=20,bw=(W-L-6)/weeks.length,svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Minutos de cardio por semana y zona">';
  [0,.5,1].forEach(function(f){var y=8+(1-f)*(H-8-B);svg+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(mx*f)+'</text>'});
  tot.forEach(function(z,i){var y=H-B,x=L+i*bw+3;for(var k=0;k<6;k++){var h=z[k]/mx*(H-8-B);if(h<=0)continue;y-=h;svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-6).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="var(--z'+k+')"/>'}
    svg+='<text x="'+(x+(bw-6)/2).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+parse(weeks[i]).getDate()+'/'+(parse(weeks[i]).getMonth()+1)+'</text>'});
  svg+='</svg>';
  out+='<div class="card"><div class="up" style="margin-bottom:6px">Cardio por zona, minutos por semana</div>'+svg+zoneLegend()+'<div class="small muted" style="margin-top:6px">'+zoneNote()+' En el agua, la lectura de muñeca puede ser menos fiable.</div></div>';}
  if(vo.length>1)out+='<div class="card"><div class="up" style="margin-bottom:6px">VO₂max</div>'+lineChart([{pts:vo.map(function(v){return {x:v.date,y:v.vo2max}}),color:'var(--accent)',line:true,dots:true,r:2}],{label:'Evolución del VO2max'})+'</div>';
  if(ws.length){var shown=ws.slice(0,S.watchLimit);

    (ws.length>shown.length?'<button class="btn ghost block" style="margin-top:8px" data-act="moreWatch">Ver más</button>':'')+'</div>';}

function schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render()})}
function syncBanner(){
  if(DEMO)return '<div class="banner">Modo demo: los datos se guardan solo en este navegador.</div>';
  if(G.status==='auth')return '<div class="banner lock"><span>Tus cambios se guardan en este dispositivo. Conecta con Google para subirlos a tu Drive.</span><button class="link" data-act="reconnect">Conectar</button></div>';
  if(G.status==='error')return '<div class="banner lock"><span>No se pudo sincronizar con Drive'+(G.err?' ('+esc(G.err)+')':'')+'. Tus datos siguen en este dispositivo.</span><button class="link" data-act="syncNow">Reintentar</button></div>';
  return '';
}
function render(){
  var a=document.activeElement,keep=a&&a.id?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null;
  var nav=document.querySelector('nav.tabs');
  if(S.auth==='out'){document.getElementById('app').innerHTML=viewLogin();nav.hidden=true;if(typeof restPaint==='function')restPaint();return}
  if(S.auth==='wait'||!ST.mem){document.getElementById('app').innerHTML='<div class="card empty" style="margin-top:24px">Cargando…</div>';nav.hidden=true;return}
  nav.hidden=false;
  var body=S.tab==='train'?viewTrain():S.tab==='food'?viewFood():S.tab==='body'?viewBody():S.tab==='progress'?viewProgress():S.tab==='settings'?viewSettings():S.tab==='plan'?viewPlan():viewWatch();
  document.getElementById('app').innerHTML=header()+'<main>'+syncBanner()+lockBanner()+body+'</main>';
  applyLock();
  document.getElementById('tabs').innerHTML=[['train','Entreno'],['food','Comida'],['body','Cuerpo'],['watch','Watch'],['progress','Progreso']].map(function(t){return '<button data-act="tab" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="true"':'')+'>'+t[1]+'</button>'}).join('');
  if(typeof restPaint==='function')restPaint();
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{if(keep.s!=null&&el.type==='text')el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}

/* ---------- acciones ---------- */
function liftDoc(exId,name,timed){var id=S.date+'_'+exId;return S.lifts[id]?JSON.parse(JSON.stringify(S.lifts[id])):{date:S.date,day:dayOf(S.date),exId:exId,name:name,timed:timed?true:undefined,sets:[]}}
function commitLift(l){S.lifts[l.date+'_'+l.exId]=l;saveDoc('lifts',l.date+'_'+l.exId,l);schedule()}
function arm(key,fn){if(S.armed===key){S.armed=null;fn()}else{S.armed=key;clearTimeout(arm._t);arm._t=setTimeout(function(){S.armed=null;schedule()},3000)}schedule()}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;var act=b.dataset.act,ex=b.dataset.ex;
  if(act==='tab'){S.tab=b.dataset.tab;S.armed=null;window.scrollTo(0,0);render()}
  else if(act==='prev'){S.date=addDays(S.date,-1);render()}
  else if(act==='next'){S.date=addDays(S.date,1);render()}
  else if(act==='today'){S.date=today();render()}
  else if(act==='day'){var d=b.dataset.day;var nd=Object.assign({date:S.date},S.days[S.date]||{},{day:d});S.days[S.date]=nd;saveDoc('days',S.date,nd);render()}
  else if(act==='addSet'){var l=liftDoc(ex,b.dataset.name,b.dataset.timed),by=liftsByEx()[ex]||[],prev=by.filter(function(x){return x.date<S.date})[0],i=l.sets.length,src=l.sets[i-1]||(prev&&prev.sets[i])||{};
    l.sets.push({kg:src.kg==null?null:src.kg,reps:src.reps==null?null:src.reps});commitLift(l)}
  else if(act==='copyLast'){var l2=liftDoc(ex,b.dataset.name),pv=(liftsByEx()[ex]||[]).filter(function(x){return x.date<S.date})[0];if(pv){l2.sets=pv.sets.map(function(s){return {kg:s.kg,reps:s.reps}});if(pv.timed)l2.timed=true;commitLift(l2)}}
  else if(act==='delSet'){arm('delSet'+b.dataset.key,function(){var l3=liftDoc(ex,'');l3.sets.splice(Number(b.dataset.i),1);
    var inPl=((S.plan[dayOf(S.date)]||{}).exercises||[]).some(function(e){return e.id===ex});
    if(!l3.sets.length&&!inPl){delete S.lifts[S.date+'_'+ex];removeDoc('lifts',S.date+'_'+ex)}else commitLift(l3)})}
  else if(act==='addEx'){var nm=S.draft.newEx.trim();if(!nm){toast('Escribe el nombre del ejercicio');return}
    var cat=catalogFind(nm),id=cat?cat[0]:slugId(nm);var l4=liftDoc(id,cat?cat[1]:nm,cat&&cat[2]);l4.sets.push({kg:null,reps:null});S.draft.newEx='';commitLift(l4)}
  else if(act==='addMeal'){var m=S.draft.meal,k=num(m.kcal);if(!m.name.trim()||k==null){toast('Pon el nombre y las kcal');return}
    if(!canWrite())return;var obj={date:S.date,time:m.time||nowTime(),name:m.name.trim(),kcal:k,p:num(m.p),est:!!m.est,ts:Date.now()};
    var mid=uid();S.meals[mid]=obj;saveDoc('meals',mid,obj);S.draft.meal={name:'',kcal:'',p:'',est:m.est,time:''};schedule()}
  else if(act==='quickMeal'){if(!canWrite())return;var ob={date:S.date,time:nowTime(),name:b.dataset.name,kcal:Number(b.dataset.kcal),p:num(b.dataset.p),est:true,ts:Date.now()};var qid=uid();S.meals[qid]=ob;saveDoc('meals',qid,ob);toast('Añadido: '+ob.name+' (estimado)');schedule()}
  else if(act==='delMeal'){arm('delMeal'+b.dataset.key,function(){delete S.meals[b.dataset.key];removeDoc('meals',b.dataset.key);schedule()})}
  else if(act==='saveBody'){var d2=S.draft.body,cur=S.body[S.date]?Object.assign({},S.body[S.date]):{date:S.date},any=false;
    [['weight','weight'],['waist','waist'],['neck','neck'],['hip','hip']].forEach(function(p){var v=num(d2[p[0]]);if(v!=null&&v>0){cur[p[1]]=v;any=true}});
    if(!any){toast('Escribe al menos una medida');return}cur.src='manual';S.body[S.date]=cur;saveDoc('body',S.date,cur);S.draft.body={weight:'',waist:'',neck:'',hip:''};toast('Guardado');schedule()}
  else if(act==='delBody'){arm('delBody'+b.dataset.key,function(){delete S.body[b.dataset.key];removeDoc('body',b.dataset.key);schedule()})}
  else if(act==='swimDone'){var cd=Object.assign({date:S.date,day:dayOf(S.date)},S.days[S.date]||{});cd.swim=!cd.swim;S.days[S.date]=cd;saveDoc('days',S.date,cd);render()}
  else if(act==='moreWatch'){S.watchLimit+=20;render()}
});
document.addEventListener('change',function(ev){
  var t=ev.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='kg'||f==='reps'){var l=liftDoc(t.dataset.ex,t.dataset.name),i=Number(t.dataset.i);if(!l.sets[i])return;l.sets[i][f==='kg'?'kg':'reps']=f==='kg'?num(t.value):(num(t.value)==null?null:Math.round(num(t.value)));commitLift(l)}

document.addEventListener('input',function(ev){

  if(f==='mname')D.meal.name=t.value;else if(f==='mkcal')D.meal.kcal=t.value;else if(f==='mp')D.meal.p=t.value;else if(f==='mtime')D.meal.time=t.value;else if(f==='mest')D.meal.est=t.checked;

function applyTheme(){var t=stGet('de_theme','auto');if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
applyTheme();

  else if(act==='back'){S.tab=S.tab==='plan'?(S.planBack||'train'):(S.back||'train');S.armed=null;window.scrollTo(0,0);render()}
  else if(act==='sex'){saveMe({sex:m.sex===b.dataset.v?null:b.dataset.v})}
  else if(act==='toggle'){var o={};o[b.dataset.k]=!m[b.dataset.k];saveMe(o)}
  else if(act==='addGym'){var g=S.draft.gymNew.trim();if(!g){toast('Escribe el nombre');return}var gs=(m.gyms||[]).slice();if(gs.indexOf(g)<0)gs.push(g);S.draft.gymNew='';saveMe({gyms:gs})}

/* ---------- gimnasio y sauna ---------- */
function dayDoc(){return Object.assign({date:S.date},S.days[S.date]||{})}
function saveDay(nd){S.days[S.date]=nd;saveDoc('days',S.date,nd);schedule()}
function latestWeight(){var best=null;Object.keys(S.body).forEach(function(k){var b=S.body[k];if(b&&b.weight!=null&&(!best||b.date>best.date))best=b});return best?best.weight:null}
/* Gasto en reposo por hora con la ecuación de Mifflin-St Jeor (1990). Necesita peso, altura, edad y sexo; si falta algo no se estima. */
function bmrHour(){var w=latestWeight(),m=ME(),h=T().height;if(!w||!h||!m.age||!m.sex)return null;return (10*w+6.25*h-5*m.age+(m.sex==='h'?5:-161))/24}
/* Estimación orientativa: entre 0,5 y 1 vez el gasto en reposo durante el tiempo de sauna (sin medición fiable). */
function saunaKcal(min){var bh=bmrHour();if(bh==null)return null;var base=bh*(min/60);return [Math.round(base*0.5),Math.round(base*1.0)]}
function viewTrain(){var m=ME();return (m.hideGym?'':gymCard())+viewTrainMain()+(m.hideSauna?'':saunaCard())}
function gymCard(){
  var GYMS=ME().gyms||[];
  var cur=(S.days[S.date]&&S.days[S.date].gym)||'';
  var chips=GYMS.map(function(g){return '<button class="chip" style="flex:none" data-act="gym" data-gym="'+esc(g)+'" aria-pressed="'+(g===cur)+'">'+esc(g)+'</button>'}).join('');
  var other=GYMS.indexOf(cur)<0?cur:'';
  var cnt={},from=addDays(today(),-30);
  Object.keys(S.days).forEach(function(k){var d=S.days[k];if(d&&d.gym&&k>=from&&k<=today())cnt[d.gym]=(cnt[d.gym]||0)+1});
  var cs=Object.keys(cnt).map(function(g){return esc(g)+': '+cnt[g]}).join(' · ');
  return '<div class="card"><div class="up" style="margin-bottom:8px">Gimnasio</div>'+(chips?'<div class="chips" style="flex-wrap:wrap;overflow:visible">'+chips+'</div>':'')+
    '<div style="margin-top:8px"><label for="gym-other">'+(chips?'Otro gimnasio':'Gimnasio de hoy')+'</label><input type="text" id="gym-other" data-f="gymOther" value="'+esc(other)+'" placeholder="Nombre"></div>'+
    (cs?'<div class="small muted" style="margin-top:6px">Últimos 30 días: '+cs+'</div>':'')+(GYMS.length?'':'<div class="small muted" style="margin-top:6px">Guarda tus gimnasios habituales en Ajustes.</div>')+'</div>';
}
function saunaCard(){
  var dd=S.days[S.date]||{},sa=dd.sauna,done=!!(sa&&sa.done);
  var h='<div class="card"><h3 style="font-size:22px">Sauna</h3>';
  h+='<button class="btn'+(done?'':' ghost')+' block" style="margin:8px 0" data-act="saunaToggle" aria-pressed="'+done+'">'+(done?'Sauna hecha':'Marcar sauna como hecha')+'</button>';
  if(done){
    h+='<div class="grid2" style="margin-bottom:8px"><div><label for="sa-min">Tiempo total (min)</label><input type="text" inputmode="numeric" id="sa-min" data-f="saMin" value="'+esc(sa.min==null?'':sa.min)+'" placeholder="Ej. 30"></div>'+
      '<div><label for="sa-temp">Temperatura (°C)</label><input type="text" inputmode="numeric" id="sa-temp" data-f="saTemp" value="'+esc(sa.temp==null?'':sa.temp)+'" placeholder="Ej. 85"></div></div>';
    h+='<div class="chips" style="margin-bottom:8px">'+[['dry','Seca'],['steam','Vapor'],['ir','Infrarrojos']].map(function(k){return '<button class="chip" data-act="saunaKind" data-kind="'+k[0]+'" aria-pressed="'+(sa.kind===k[0])+'">'+k[1]+'</button>'}).join('')+'</div>';
    if(sa.min){var r=saunaKcal(sa.min);h+=r?'<div class="kv"><span>Calorías extra estimadas</span><b class="num" style="font-size:18px">~'+r[0]+'–'+r[1]+' kcal</b></div>':'<div class="kv"><span>Calorías extra estimadas</span><span class="muted small" style="text-align:right">Completa sexo, edad y altura en Ajustes y registra tu peso</span></div>'}
  }
  return h+saunaSummary()+'</div>';
}
function saunaSummary(){
  var ws=weekStart(S.date),n=0,mins=0,lo=0,hi=0,est=true;
  for(var i=0;i<7;i++){var s=S.days[addDays(ws,i)];s=s&&s.sauna;if(s&&s.done){n++;if(s.min){mins+=s.min;var r=saunaKcal(s.min);if(r){lo+=r[0];hi+=r[1]}else est=false}}}
  var h='<div class="kv"><span>Esta semana</span><span>'+n+(n===1?' sesión':' sesiones')+(mins?' · '+mins+' min'+(est&&hi?' · ~'+lo+'–'+hi+' kcal extra':''):'')+'</span></div>'+saunaCompare();
  h+='<details style="margin-top:6px"><summary>¿Qué beneficios tiene? Lo que dice la evidencia</summary>'+
    '<p><b>Calorías:</b> el efecto es pequeño. No hay mediciones fiables, así que la cifra de arriba es una suposición orientativa (entre la mitad y el total de tu gasto en reposo estimado con la ecuación de Mifflin-St Jeor). El peso que baja en la sauna es sobre todo agua, y vuelve al beber.</p>'+
    '<p><b>Músculo:</b> no hay evidencia sólida de que la sauna haga crecer músculo ni suba la fuerza. Una revisión de 14 estudios (194 personas) sobre calor después de entrenar encontró efectos mixtos en la recuperación (4 sin efecto, 4 beneficiosos y 1 perjudicial) y no aportó datos de fuerza ni de hipertrofia.</p>'+
    '<p><b>Resistencia:</b> en esos estudios, el calor tras entrenar pudo mejorar el rendimiento corriendo, sobre todo en calor, y no cambió el ciclismo ni el VO₂max.</p>'+

    else L.push(['n','Calorías: media '+fmt(kAvg,0)+' kcal. Sin objetivo definido.'])}
  var dl=7-((parse(t0).getDay()+6)%7)-1;
  if(G2){var zr=z2w/G2;L.push([zr>=.9?'ok':zr>=.4?'mid':'low','Zone 2 esta semana: '+fmt(z2w,0)+' de '+G2+' min. '+(dl>0?'Quedan '+dl+(dl===1?' día.':' días.'):'Última jornada de la semana.')])}
  else if(cardio.length)L.push(['n','Zone 2 esta semana: '+fmt(z2w,0)+' min.']);
  if(spAvg!=null)L.push(['n','Pasos: media de '+fmt(spAvg,0)+' al día en los últimos '+sd.length+' días cerrados.']);
  L.push([sessW>=3?'ok':sessW>=1?'mid':'low','Fuerza esta semana: '+sessW+(sessW===1?' sesión':' sesiones')+(tonW?' · '+fmt(tonW,0)+' kg de volumen'+(tonP?' ('+(tonW>=tonP?'+':'')+fmt((tonW/tonP-1)*100,0)+' % frente a la semana pasada)':''):'')+'.']);
  if(wl&&wref){var dw=wl.weight-wref.weight;L.push(['ok','Peso: '+fmt(wl.weight)+' kg ('+(dw>=0?'+':'')+fmt(dw)+' kg desde el '+fmtShort(wref.date)+').'])}
  out+='<div class="card"><div class="up" style="margin-bottom:4px">Resumen</div>'+L.map(function(x){return '<div class="sumline">'+dotHtml(x[0])+esc(x[1])+'</div>'}).join('')+
    '<div class="small muted" style="margin-top:6px">Las medias usan solo días cerrados con comidas registradas. Hoy no cuenta hasta que acabe.</div></div>';

  /* tarjetas */
  var pr=function(cls,up,v,sub){return '<div class="tile"><div class="up">'+up+'</div><div class="v">'+v+'</div><div class="small muted">'+sub+'</div></div>'};
  out+='<div class="tiles">'+
    pr('','Peso',(wl?fmt(wl.weight):'–')+' <small>kg</small>',wl?(wref?((wl.weight-wref.weight>=0?'+':'')+fmt(wl.weight-wref.weight)+' kg desde '+fmtShort(wref.date)):fmtShort(wl.date)):'sin datos')+
    pr('','Cintura',(wsl?fmt(wsl.waist):'–')+' <small>cm</small>',wsl?(wsf?((wsl.waist-wsf.waist>=0?'+':'')+fmt(wsl.waist-wsf.waist)+' cm desde '+fmtShort(wsf.date)):fmtShort(wsl.date)):'Mídela en la pestaña Cuerpo')+
    pr('','Proteína media',(pAvg!=null?fmt(pAvg,0):'–')+' <small>g</small>',pAvg!=null?(pTg?'objetivo '+fmt(pTg,0)+' g':'sin objetivo'):'sin días cerrados')+
    pr('','Calorías medias',(kAvg!=null?fmt(kAvg,0):'–')+' <small>kcal</small>',kAvg!=null?(kTg?'objetivo '+fmt(kTg,0)+' kcal':'sin objetivo'):'sin días cerrados')+
    pr('','Zone 2 semana',fmt(z2w,0)+' <small>'+(G2?'/ '+G2+' min':'min')+'</small>',G2?'<div class="bar" style="margin:4px 0 0"><i style="width:'+Math.min(100,z2w/G2*100).toFixed(0)+'%"></i></div>':'sin objetivo semanal')+
    pr('','Fuerza semana',sessW+' <small>'+(sessW===1?'sesión':'sesiones')+'</small>',tonW?fmt(tonW,0)+' kg de volumen':'sin series')+
    pr('','Sueño medio',sAvg!=null?hmHtml(sAvg):'–',ns.length?'últimas '+ns.length+(ns.length===1?' noche':' noches'):'sin datos')+
    pr('','VO₂max',(vl?fmt(vl.vo2max):'–'),vl&&vf&&vl!==vf?((vl.vo2max>=vf.vo2max?'+':'')+fmt(vl.vo2max-vf.vo2max)+' desde '+fmtShort(vf.date)):'estimado por el reloj')+'</div>';

  /* peso */
  var wps=wts.map(function(r){return {x:r.date,y:r.weight}});
  var avg=wts.map(function(r){var from=addDays(r.date,-6);var w=wts.filter(function(q){return q.date>=from&&q.date<=r.date});return {x:r.date,y:w.reduce(function(a,q){return a+q.weight},0)/w.length}});
  if(wps.length>1)out+='<div class="card"><div class="up" style="margin-bottom:6px">Peso y media de 7 días</div>'+lineChart([{pts:wps,color:'var(--muted)',dots:true,r:2.5},{pts:avg,color:'var(--accent)',line:true,w:2.5,endLabel:true}],{label:'Evolución del peso en kg'})+'</div>';

  /* pasos por día */
  if(Object.keys(sp).length){var spv=[];for(i=13;i>=0;i--){d=addDays(t0,-i);spv.push({lab:String(parse(d).getDate()),y:sp[d]?sp[d].steps:null,part:d===t0})}
    out+='<div class="card"><div class="up" style="margin-bottom:6px">Pasos por día · 14 días</div>'+barChart(spv,null,{label:'Pasos por día'})+
      '<div class="small muted" style="margin-top:4px">Pasos que has anotado cada día. Hoy, más clara y aún en curso.</div></div>'}

  /* comida por día */
  var TK=T().train.kcal,TP=T().train.p;
  var kv=[],pv=[];for(i=13;i>=0;i--){d=addDays(t0,-i);var m=mt[d],lab=String(parse(d).getDate());kv.push({lab:lab,y:m?m.kcal:null,part:d===t0});pv.push({lab:lab,y:m?m.p:null,part:d===t0})}
  if(Object.keys(mt).length){
    out+='<div class="card"><div class="up" style="margin-bottom:6px">Calorías por día · 14 días</div>'+barChart(kv,TK,{label:'Calorías por día',band:true})+
      '<div class="small muted" style="margin-top:4px">'+(TK?'Línea discontinua: objetivo de día de entreno ('+fmt(TK,0)+'). Barra ámbar: fuera de ±10 % de ese objetivo. ':'Define tus objetivos en Ajustes para ver la línea de referencia. ')+'Hoy, más clara.</div></div>';
    out+='<div class="card"><div class="up" style="margin-bottom:6px">Proteína por día · 14 días</div>'+barChart(pv,TP,{label:'Proteína por día en gramos'})+
      '<div class="small muted" style="margin-top:4px">'+(TP?'Línea discontinua: objetivo ('+fmt(TP,0)+' g). Barra ámbar: por debajo del 90 %.':'Sin objetivo de proteína definido.')+'</div></div>'}

  /* semanas */
  var weeks=[];for(i=7;i>=0;i--)weeks.push(addDays(ws0,-7*i));
  var wl8=function(wd){var p=parse(wd);return p.getDate()+'/'+(p.getMonth()+1)};
  if(Object.keys(tonByWeek).length)out+='<div class="card"><div class="up" style="margin-bottom:6px">Volumen de fuerza por semana (kg)</div>'+barChart(weeks.map(function(wd){return {lab:wl8(wd),y:tonByWeek[wd]||0}}),null,{label:'Volumen semanal en kg'})+
    '<div class="small muted" style="margin-top:4px">Suma de kg × repeticiones de las series registradas. La semana de hoy está en curso.</div></div>';
  if(cardio.length){var zw=weeks.map(function(wd){var z=0;cardio.forEach(function(w){if(weekStart(w.date)===wd)z+=w.z[2]||0});return {lab:wl8(wd),y:z}});
    out+='<div class="card"><div class="up" style="margin-bottom:6px">Zone 2 por semana (min)</div>'+barChart(zw,G2,{label:'Minutos en zona 2 por semana'})+
      '<div class="small muted" style="margin-top:4px">'+(G2?'Línea discontinua: objetivo semanal ('+G2+' min). Barra ámbar: por debajo del 90 %.':'Sin objetivo semanal definido.')+'</div></div>'}

  /* fuerza por ejercicio */
  var by=liftsByEx(),pl=[];
  Object.keys(by).forEach(function(ex){var sess=by[ex].map(function(l){return bestSet([l])}).filter(Boolean).sort(function(a,b){return a.date<b.date?-1:1});
    if(sess.length>=2){var f=sess[0],la=sess[sess.length-1];pl.push({name:by[ex][0].name,n:sess.length,f:f,l:la,ch:(e1rm(la.s)/e1rm(f.s)-1)*100})}});
  pl.sort(function(a,b){return b.n-a.n});
  out+='<div class="card"><div class="up" style="margin-bottom:4px">Fuerza por ejercicio</div>'+(pl.length?'<div class="list">'+pl.slice(0,6).map(function(p){
    return '<div><div class="grow"><div class="t"><b>'+esc(p.name)+'</b></div><div class="muted small">'+fmtShort(p.f.date)+': '+fmt(p.f.s.kg)+' × '+p.f.s.reps+' → '+fmtShort(p.l.date)+': '+fmt(p.l.s.kg)+' × '+p.l.s.reps+'</div></div><div class="num" style="font-size:20px;font-weight:600">'+(p.ch>=0?'+':'')+fmt(p.ch,0)+' %</div></div>'}).join('')+'</div><div class="small muted" style="margin-top:6px">Mejor serie de cada sesión, comparada por 1RM estimado (fórmula de Epley). Es una estimación.</div>':
    '<div class="empty">Saldrá cuando repitas un ejercicio en dos días distintos.</div>')+'</div>';
  return out;
}

/* =====================================================================
   Google: acceso y Google Drive
   ===================================================================== */
var DRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata',SCOPES='openid email profile '+DRIVE_SCOPE,DRIVE_FILE='diario-de-entreno.json';
var G={client:null,token:null,exp:0,fileId:null,chain:Promise.resolve(),timer:null,dirty:false,status:'ok',last:null,err:''};
function tokenValid(){return !!G.token&&Date.now()<G.exp}
function syncLabel(){return ({ok:G.last?'Sincronizado a las '+new Date(G.last).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'Conectado',saving:'Guardando…',pending:'Cambios pendientes de subir',auth:'Sin conexión con Google: cambios solo en este dispositivo',error:'Error al sincronizar'})[G.status]||''}
function setSync(s,detail){var changed=G.status!==s||s==='error';G.status=s;G.err=detail||'';if(changed)schedule()}
function waitForGoogle(ms){return new Promise(function(res,rej){var t0=Date.now();(function poll(){if(window.google&&google.accounts&&google.accounts.oauth2)return res();if(Date.now()-t0>ms)return rej(new Error('No se pudo cargar el acceso de Google. Revisa tu conexión o el bloqueador de contenido.'));setTimeout(poll,150)})()})}
function initGoogle(){
  waitForGoogle(10000).then(function(){
    G.client=google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:SCOPES,callback:onToken,
      error_callback:function(err){var m=err&&err.type==='popup_failed_to_open'?'El navegador bloqueó la ventana de Google. Permite ventanas emergentes para este sitio.':err&&err.type==='popup_closed'?'Se cerró la ventana de Google antes de terminar.':'No se pudo conectar con Google.';S.authMsg=m;if(S.auth==='in')toast(m);schedule()}});
    schedule();
  },function(e){S.authMsg=e.message;schedule()});
}
function googleLogin(selectAccount){
  if(!G.client){toast('El acceso de Google aún se está cargando. Inténtalo en unos segundos.');return}
  var u=stGet('de_user',null);G.client.requestAccessToken(selectAccount||!u?{prompt:'select_account'}:{prompt:'',login_hint:u.email});
}
function onToken(resp){
  if(resp.error){S.authMsg='Google no concedió el acceso ('+resp.error+').';schedule();return}
  if(!google.accounts.oauth2.hasGrantedAllScopes(resp,DRIVE_SCOPE)){S.authMsg='Sin el permiso de Google Drive no se pueden guardar tus datos. Vuelve a entrar y marca la casilla de Drive.';if(S.auth==='in')toast(S.authMsg);schedule();return}
  G.token=resp.access_token;G.exp=Date.now()+(Number(resp.expires_in)||3600)*1000-120000;
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+G.token}}).then(function(r){if(!r.ok)throw new Error('perfil '+r.status);return r.json()}).then(function(info){
    var user={id:info.sub,email:info.email,name:info.name||''};
    if(S.user&&S.user.id!==user.id){stSet('de_user',user);location.reload();return}
    stSet('de_user',user);S.authMsg='';
    if(S.auth!=='in'){S.user=user;openStore('de_cache_'+user.id);S.auth='in';S.tab='train'}
    syncNow();
  }).catch(function(){S.authMsg='No se pudo leer tu perfil de Google.';schedule()});
}
function driveFetch(url,opts){opts=opts||{};
  if(!tokenValid()){G.token=null;var e=new Error('sesión de Google caducada');e.auth=true;return Promise.reject(e)}
  var h=Object.assign({},opts.headers||{},{Authorization:'Bearer '+G.token});
  return fetch(url,Object.assign({},opts,{headers:h})).then(function(r){
    if(r.status===401){G.token=null;var e2=new Error('sesión de Google caducada');e2.auth=true;throw e2}
    if(!r.ok)throw new Error('Drive respondió '+r.status);return r})}
function driveFindFile(){if(G.fileId)return Promise.resolve(G.fileId);
  var q=encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false");
  return driveFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+q+'&fields=files(id)&pageSize=10').then(function(r){return r.json()}).then(function(j){G.fileId=(j.files&&j.files[0]&&j.files[0].id)||null;return G.fileId})}
function driveDownload(){return driveFindFile().then(function(id){if(!id)return null;return driveFetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media').then(function(r){return r.json().catch(function(){return null})})})}
function driveUpload(data){var body=JSON.stringify(data);
  if(G.fileId)return driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+G.fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
  var bd='de'+uid().replace(/-/g,''),meta=JSON.stringify({name:DRIVE_FILE,parents:['appDataFolder'],mimeType:'application/json'});
  var mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
  return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp}).then(function(r){return r.json()}).then(function(j){G.fileId=j.id})}
function scheduleSync(){G.dirty=true;if(G.status==='ok'||G.status==='saving')setSync('pending');clearTimeout(G.timer);G.timer=setTimeout(syncNow,1500)}
function syncNow(){G.chain=G.chain.then(doSync,doSync);return G.chain}
function doSync(){
  if(DEMO||!ST.mem)return;
  if(!tokenValid()){setSync('auth');return}
  setSync('saving');
  return driveDownload().then(function(remote){
    var before=JSON.stringify(ST.mem),merged=remote?mergeData(ST.mem,remote):normalize(ST.mem),changed=JSON.stringify(merged)!==before;
    if(changed){ST.mem=merged;stSet(ST.key,ST.mem);bindCols()}
    G.dirty=false;
    return driveUpload(merged).then(function(){G.last=Date.now();setSync(G.dirty?'pending':'ok');if(changed)schedule()});
  }).catch(function(e){G.dirty=true;if(e&&e.auth)setSync('auth');else setSync('error',e&&e.message)});
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='google'||a==='reconnect')googleLogin(false);
  else if(a==='switchAcc')googleLogin(true);
  else if(a==='syncNow'){if(!tokenValid())googleLogin(false);else syncNow()}
  else if(a==='logout'){var go=function(){ST.mem=null;stDel(ST.key);stDel('de_user');location.reload()};
    if(S.armed==='logout'){S.armed=null;go()}else{S.armed='logout';if(G.dirty&&tokenValid()){clearTimeout(G.timer);syncNow()}schedule()}}
  else if(a==='wipe'){if(S.armed!=='wipe'){S.armed='wipe';schedule();return}S.armed=null;
    if(DEMO){stDel(ST.key);openStore(ST.key);toast('Datos eliminados');S.tab='train';render();return}
    if(!tokenValid()){toast('Primero conecta con Google para borrar también la copia de tu Drive.');googleLogin(false);return}
    clearTimeout(G.timer);G.chain.then(function(){G.fileId=null;return driveFindFile()}).then(function(id){if(id)return driveFetch('https://www.googleapis.com/drive/v3/files/'+id,{method:'DELETE'})}).then(function(){
      try{google.accounts.oauth2.revoke(G.token,function(){})}catch(e){}stDel(ST.key);stDel('de_user');location.reload()}).catch(function(e){toast('No se pudo borrar: '+(e&&e.message))})}
});

/* ---------- arranque ---------- */
if(DEMO){S.user={email:'demo'};openStore('de_demo_v1');S.auth='in';if(typeof window.__seedDemo==='function'&&!Object.keys(ST.mem.cols.plan).length&&!stGet('de_seeded',false)){window.__seedDemo(ST.mem);stSet(ST.key,ST.mem);stSet('de_seeded',true);bindCols()}}
else{var u0=stGet('de_user',null);if(u0){S.user=u0;openStore('de_cache_'+u0.id);S.auth='in';G.status='auth'}else S.auth='out';initGoogle()}
render();
})();
</script>
